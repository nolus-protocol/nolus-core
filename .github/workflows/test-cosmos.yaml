name: Test cosmos-sdk
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - "**"
    paths:
      - go.mod
      - go.sum
      - .github/workflows/test-cosmos.yaml
      - scripts/test/run-test-unit-cosmos.sh

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27

      - uses: "./.github/actions/private-go-modules"
        with:
          token: ${{ secrets.IBC_GO_TOKEN }}

      - name: test
        run: |
          ./scripts/test/run-test-unit-cosmos.sh

